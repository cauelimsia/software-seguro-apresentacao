<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#240a2b">
  <title>Controle · Falhar com Segurança</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>📱</text></svg>">
  <style>
    :root {
      --roxo-900: #1a0720;
      --roxo-800: #240a2b;
      --magenta: #b01e77;
      --laranja: #f26f21;
      --areia: #faf6f2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--areia);
      background: linear-gradient(160deg, #3c0f45 0%, var(--roxo-800) 60%, var(--roxo-900) 100%);
      display: flex;
      flex-direction: column;
      gap: .7rem;
      padding: .9rem .9rem calc(env(safe-area-inset-bottom) + .9rem);
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
    }

    header { display: flex; align-items: center; justify-content: space-between; gap: .6rem; }
    .marca { font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; opacity: .6; }
    .status {
      font-size: .68rem; letter-spacing: .1em; text-transform: uppercase;
      display: flex; align-items: center; gap: .38rem; opacity: .85;
    }
    .bolinha { width: .5rem; height: .5rem; border-radius: 50%; background: #d8534f; }
    .status.on .bolinha { background: #46c17f; }

    .painel {
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 1rem;
      padding: .95rem 1rem;
    }

    /* ---------- pareamento ---------- */

    #pareia { display: flex; flex-direction: column; gap: .9rem; margin: auto 0; }
    #pareia h1 { font-size: 1.28rem; font-weight: 650; line-height: 1.25; }
    #pareia p { font-size: .92rem; line-height: 1.5; opacity: .75; }
    #codigo {
      width: 100%;
      font: 650 2.4rem/1 ui-monospace, "SFMono-Regular", Menlo, monospace;
      letter-spacing: .28em;
      text-align: center;
      text-transform: uppercase;
      color: var(--areia);
      background: rgba(0, 0, 0, .28);
      border: 2px solid rgba(255, 255, 255, .18);
      border-radius: .9rem;
      padding: 1rem .6rem 1rem 1rem;
    }
    #codigo:focus { outline: none; border-color: var(--laranja); }
    #erro { font-size: .85rem; color: #ff9d8a; min-height: 1.2em; }

    /* ---------- controle ---------- */

    #controle { display: none; flex-direction: column; gap: .7rem; flex: 1; min-height: 0; }
    body.pareado #pareia { display: none; }
    body.pareado #controle { display: flex; }

    .contador { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--laranja); }
    .titulo { font-size: 1.3rem; font-weight: 650; line-height: 1.2; margin-top: .35rem; }

    .nota { flex: 1; min-height: 0; overflow-y: auto; }
    .nota .rotulo { font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; opacity: .55; margin-bottom: .35rem; }
    .nota p { font-size: .95rem; line-height: 1.5; opacity: .92; }
    .adiante { margin-top: .7rem; font-size: .8rem; opacity: .6; line-height: 1.4; }

    .atalhos { display: flex; gap: .5rem; }
    .botoes { display: grid; grid-template-columns: 1fr 2.1fr; gap: .6rem; }
    button {
      font: inherit; color: var(--areia);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 1rem;
      padding: 1.5rem .8rem; font-weight: 650;
      background: rgba(255, 255, 255, .1);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(.97); filter: brightness(1.15); }
    button:disabled { opacity: .4; }
    .atalhos button { flex: 1; padding: .7rem; font-size: .8rem; font-weight: 550; border-radius: .8rem; }
    #prox { background: linear-gradient(135deg, var(--magenta), var(--laranja)); border: 0; font-size: 1.18rem; }
    #prox small { display: block; font-size: .68rem; font-weight: 500; opacity: .85; margin-top: .2rem; }
    #entrar { background: linear-gradient(135deg, var(--magenta), var(--laranja)); border: 0; padding: 1.1rem; font-size: 1rem; }
    #trocar { background: none; border: 0; opacity: .5; font-size: .72rem; padding: .3rem; text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <span class="marca">Falhar com Segurança</span>
    <span class="status" id="status"><span class="bolinha"></span><span id="status-txt">conectando</span></span>
  </header>

  <section id="pareia">
    <h1>Digite o código que aparece na tela do deck</h1>
    <p>Ele fica no canto da tela assim que a apresentação abre. Quatro caracteres.</p>
    <input id="codigo" maxlength="4" autocomplete="off" autocapitalize="characters"
           autocorrect="off" spellcheck="false" inputmode="text" placeholder="····">
    <button id="entrar">conectar</button>
    <div id="erro"></div>
  </section>

  <section id="controle">
    <div class="painel">
      <div class="contador" id="contador">— / —</div>
      <div class="titulo" id="titulo">aguardando o deck…</div>
    </div>

    <div class="painel nota">
      <div class="rotulo">Nota do apresentador</div>
      <p id="nota">—</p>
      <div class="adiante" id="adiante"></div>
    </div>

    <div class="atalhos">
      <button id="inicio">↖ início</button>
      <button id="fim">fim ↘</button>
    </div>

    <div class="botoes">
      <button id="ant">← voltar</button>
      <button id="prox">avançar <small id="prox-dica">próximo slide</small></button>
    </div>

    <button id="trocar">parear com outro código</button>
  </section>

  <script src="vendor/mqtt.min.js"></script>
  <script>
    const BROKER = "wss://broker.emqx.io:8084/mqtt";
    const el = (id) => document.getElementById(id);

    let cliente = null;
    let base = null;
    let total = 0;

    function ligaStatus(on, texto) {
      el("status").classList.toggle("on", on);
      el("status-txt").textContent = texto;
    }

    function manda(corpo) {
      if (!cliente || !base) return;
      navigator.vibrate && navigator.vibrate(12);
      cliente.publish(base + "/acao", JSON.stringify(corpo), { qos: 0 });
    }

    el("prox").addEventListener("click", () => manda({ acao: "proximo" }));
    el("ant").addEventListener("click", () => manda({ acao: "anterior" }));
    el("inicio").addEventListener("click", () => manda({ acao: "ir", i: 0 }));
    el("fim").addEventListener("click", () => manda({ acao: "ir", i: Math.max(0, total - 1) }));

    el("trocar").addEventListener("click", () => {
      localStorage.removeItem("sala-controle");
      if (cliente) { try { cliente.end(true); } catch {} cliente = null; }
      base = null;
      document.body.classList.remove("pareado");
      el("codigo").value = "";
      ligaStatus(false, "desconectado");
    });

    function conecta(codigo) {
      codigo = (codigo || "").trim().toUpperCase();
      if (codigo.length !== 4) {
        el("erro").textContent = "O código tem 4 caracteres.";
        return;
      }
      el("erro").textContent = "";
      base = "wyden/deck/" + codigo;
      localStorage.setItem("sala-controle", codigo);
      ligaStatus(false, "conectando");

      cliente = mqtt.connect(BROKER, {
        clientId: "cel-" + codigo + "-" + Math.random().toString(16).slice(2, 8),
        keepalive: 30,
        reconnectPeriod: 2000,
        connectTimeout: 8000,
        clean: true
      });

      cliente.on("connect", () => {
        ligaStatus(true, "conectado");
        document.body.classList.add("pareado");
        cliente.subscribe(base + "/estado", { qos: 0 });
        // avisa o deck para ele sumir com o cartão do código e mandar o estado
        manda({ acao: "ola" });
      });

      cliente.on("reconnect", () => ligaStatus(false, "reconectando"));
      cliente.on("error", () => {
        ligaStatus(false, "sem conexão");
        el("erro").textContent = "Não consegui falar com o servidor. Confira a internet do celular.";
      });

      cliente.on("message", (topico, carga) => {
        const texto = carga.toString();
        if (!texto) return;  // o deck limpa o tópico retido ao fechar
        let s;
        try { s = JSON.parse(texto); } catch { return; }
        total = s.total || 0;
        el("contador").textContent = (s.i + 1) + " / " + s.total;
        el("titulo").textContent = s.titulo || "—";
        el("nota").textContent = s.nota || "—";
        el("prox-dica").textContent = s.dica || (s.revela ? "revela" : "próximo slide");
        el("adiante").textContent = s.proximoTitulo ? "a seguir: " + s.proximoTitulo : "último slide";
      });
    }

    el("entrar").addEventListener("click", () => conecta(el("codigo").value));
    el("codigo").addEventListener("keydown", (e) => {
      if (e.key === "Enter") conecta(el("codigo").value);
    });

    // reabriu a página? tenta o último código usado
    const salvo = new URLSearchParams(location.hash.slice(1)).get("sala")
      || localStorage.getItem("sala-controle");
    if (salvo) {
      el("codigo").value = salvo;
      conecta(salvo);
    } else {
      ligaStatus(false, "aguardando código");
    }

    // impede a tela de apagar no meio da apresentação
    if ("wakeLock" in navigator) {
      let trava = null;
      const segura = () => navigator.wakeLock.request("screen").then((t) => (trava = t)).catch(() => {});
      segura();
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") segura();
      });
    }
  </script>
</body>
</html>
